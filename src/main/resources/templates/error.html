<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>오류 안내 - Game Community</title>

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">

</head>

<body>

<div class="auth-container error-container">

    <h1>Game Community</h1>

    <!-- 오류 번호 -->

    <div class="error-code"
         th:text="${status}">
        404
    </div>

    <!-- 오류 유형별 안내 -->

    <div th:switch="${status}">

        <div th:case="403">

            <h2>접근 권한이 없습니다.</h2>

            <p>
                해당 페이지에 접근하거나
                요청을 처리할 권한이 없습니다.
            </p>

        </div>

        <div th:case="404">

            <h2>페이지를 찾을 수 없습니다.</h2>

            <p>
                삭제되었거나 존재하지 않는
                페이지입니다.
            </p>

        </div>

        <div th:case="400">

            <h2>잘못된 요청입니다.</h2>

            <p>
                입력한 주소 또는 요청 내용을
                다시 확인해주세요.
            </p>

        </div>

        <div th:case="*">

            <h2>오류가 발생했습니다.</h2>

            <p>
                요청을 처리하지 못했습니다.
                잠시 후 다시 시도해주세요.
            </p>

        </div>

    </div>

    <!-- 메인 홈페이지 복귀 -->

    <a class="error-home-button"
       th:href="@{/}">

        메인 홈페이지로

    </a>

</div>

</body>
</html>
