<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>로그인 - Game Community</title>

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-container">

    <h1>Game Community</h1>
    <h2>로그인</h2>

    <p class="success"
       th:if="${param.registered}">
        회원가입이 완료되었습니다.
    </p>

    <p class="error"
       th:if="${param.error}">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </p>

    <p class="success"
       th:if="${param.logout}">
        정상적으로 로그아웃되었습니다.
    </p>

    <form th:action="@{/login}" method="post">

        <label for="username">아이디</label>
        <input type="text"
               id="username"
               name="username"
               placeholder="아이디를 입력하세요"
               autocomplete="username"
               required>

        <label for="password">비밀번호</label>
        <input type="password"
               id="password"
               name="password"
               placeholder="비밀번호를 입력하세요"
               autocomplete="current-password"
               required>

        <button type="submit">로그인</button>

    </form>

    <div class="bottom-link">
        아직 계정이 없으신가요?
        <a th:href="@{/register}">회원가입</a>
    </div>

</div>

</body>
</html>
