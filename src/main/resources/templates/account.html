<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>로그인 성공 - Game Community</title>

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-container">

    <h1>Game Community</h1>
    <h2>로그인 성공</h2>

    <p class="success">
        <strong th:text="${username}"></strong>님,
        환영합니다.
    </p>

    <p>정상적으로 로그인되었습니다.</p>

    <form th:action="@{/logout}" method="post">
        <button type="submit">로그아웃</button>
    </form>

</div>

</body>
</html>
