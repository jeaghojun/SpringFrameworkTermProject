spring.application.name=gamecommunity

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/gamecommunity
spring.datasource.username=gamecommunity_user
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 오류 정보 노출 방지
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never